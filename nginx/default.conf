# Rate-limit zones. conf.d files are included inside http{}, which is the only
# context limit_req_zone is valid in.
limit_req_zone $binary_remote_addr zone=iv_api:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=iv_submit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=iv_login:10m  rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the API's own 5 MB image cap, so an oversized upload gets
    # the API's readable error rather than a bare nginx 413.
    client_max_body_size 6m;

    # Basic hardening. HSTS belongs on the TLS terminator in front of this.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The whole public read path: a static file the API regenerates on save.
    # Python is not involved, so the site keeps serving with the API stopped.
    location = /content.json {
        root /data/content/dist;
        etag on;
        add_header Cache-Control "no-cache";
    }

    # Filenames carry a content hash and a replacement always writes a new
    # name, so these can be cached hard without ever going stale.
    location /media/ {
        alias /data/content/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Vite emits hashed filenames here too.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Tightest limit on the one unauthenticated write endpoint.
    location = /api/submissions {
        limit_req zone=iv_submit burst=3 nodelay;
        include /etc/nginx/iv_proxy.conf;
    }

    # Slows credential stuffing to a crawl without locking anyone out.
    location = /api/auth/login {
        limit_req zone=iv_login burst=3 nodelay;
        include /etc/nginx/iv_proxy.conf;
    }

    location /api/ {
        limit_req zone=iv_api burst=20 nodelay;
        include /etc/nginx/iv_proxy.conf;
    }

    # Everything else is the SPA, including /admin — which is a client route,
    # not a file, so it has to fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
